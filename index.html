<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Missouri Life Manager</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F3F7;
  --card:#FFFFFF;
  --text:#0D1E3D;
  --muted:#6B7C93;
  --light:#A8B8CC;
  --border:#E2EAF2;
  --navy:#0D1E3D;
  --navy2:#162844;
  --blue:#1557B0;
  --blue-pale:#EBF3FF;
  --teal:#00957A;
  --teal-pale:#E6F7F4;
  --amber:#E8920A;
  --amber-pale:#FEF6E8;
  --coral:#D94040;
  --coral-pale:#FEEDED;
  --purple:#5B4FD4;
  --purple-pale:#EFEDFC;
  --shadow-sm:0 1px 4px rgba(13,30,61,.06);
  --shadow:0 2px 12px rgba(13,30,61,.08);
  --shadow-md:0 4px 24px rgba(13,30,61,.11);
  --r:12px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
input,select,textarea{outline:none;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif}
button:disabled{opacity:.3;cursor:not-allowed!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:var(--navy);padding:0;flex-shrink:0;position:relative;overflow:hidden}
.hdr-top{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:18px;color:white;font-style:italic;flex-shrink:0}
.logo-text{color:white}
.logo-title{font-family:'DM Serif Display',serif;font-size:20px;color:white;letter-spacing:-.3px;line-height:1.1}
.logo-sub{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.8px;font-weight:500;margin-top:2px}
.dday-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:6px 14px;font-size:11px;color:rgba(255,255,255,.65);font-weight:500;white-space:nowrap}

/* ── Rate strip ── */
.rate-strip{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.06);margin-top:14px}
.rate-lbl{font-size:10.5px;color:rgba(255,255,255,.35);letter-spacing:.5px;font-weight:500}
.rate-val{font-size:16px;font-weight:700;color:#5EC9FF;letter-spacing:-.3px}
.rate-edit-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.rate-edit-btn:hover{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
.rate-input-inline{background:transparent;border:none;border-bottom:2px solid #5EC9FF;color:#5EC9FF;font-size:15px;font-weight:700;width:90px;text-align:center;font-family:'DM Sans',sans-serif;padding:0 4px}

/* ── Tab bar ── */
.tab-bar{background:var(--navy2);display:flex;flex-shrink:0;padding:0 12px;gap:2px;border-top:1px solid rgba(255,255,255,.05)}
.tab-btn{flex:1;padding:13px 4px 12px;background:transparent;border:none;border-bottom:2.5px solid transparent;color:rgba(255,255,255,.35);font-size:10.5px;cursor:pointer;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;font-weight:600;white-space:nowrap;transition:all .2s;letter-spacing:.2px;margin-bottom:-1px}
.tab-btn:hover{color:rgba(255,255,255,.65)}
.tab-btn.active{color:#5EC9FF;border-bottom-color:#1557B0}

/* ── Content ── */
.content{padding:20px;flex:1;overflow-y:auto}

/* ── Section header ── */
.sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;margin-top:6px}
.sec-hdr::before{content:'▸';color:var(--blue);font-size:12px}
.sec-hdr-txt{font-weight:700;font-size:13.5px;color:var(--text)}
.sec-hdr-line{flex:1;height:1px;background:var(--border)}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:14px}
.card-title{font-weight:700;font-size:10.5px;color:var(--muted);letter-spacing:1.3px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:6px}

/* ── Metric tiles ── */
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.metric-tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);text-align:center}
.metric-tile .m-lbl{font-size:9.5px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.metric-tile .m-val{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);line-height:1.1}
.metric-tile .m-sub{font-size:10px;color:var(--muted);margin-top:4px}

/* ── Banner strip ── */
.banner{background:var(--navy);color:white;border-radius:var(--r);padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,.03);border-radius:50%}
.banner-lbl{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.8px;font-weight:600;text-transform:uppercase;margin-bottom:6px}
.banner-val{font-family:'DM Serif Display',serif;font-size:28px;color:white;letter-spacing:-.5px}
.banner-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:5px}

/* ── Month Nav ── */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow-sm)}
.mn-btn{background:var(--blue-pale);color:var(--blue);border:none;border-radius:var(--r-sm);width:32px;height:32px;font-size:16px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.mn-btn:hover{background:var(--blue);color:white}
.mn-btn:disabled{opacity:.3}
.mn-label{font-family:'DM Serif Display',serif;font-size:19px;color:var(--text);text-align:center;flex:1}

/* ── Inputs ── */
.field{margin-bottom:14px}
.lbl{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.i-wrap{display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:var(--r-sm);overflow:hidden;transition:border-color .2s;background:white}
.i-wrap:focus-within{border-color:var(--blue)}
.prefix{padding:0 12px;background:#F5F7FA;color:var(--muted);font-size:13px;display:flex;align-items:center;border-right:1.5px solid var(--border);min-width:38px;justify-content:center;font-weight:700}
.inp{flex:1;border:none;padding:10px 14px;font-size:14px;background:transparent;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;width:100%;color:var(--text)}
.hint{font-size:10.5px;color:var(--teal);margin-top:4px;font-weight:500}
.divider-line{border-top:1.5px dashed var(--border);margin:14px 0 10px}
.total-line{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:var(--text);padding:10px 14px;background:var(--bg);border-radius:var(--r-sm)}

/* ── Preset badge ── */
.preset-badge{display:inline-flex;align-items:center;gap:5px;background:var(--teal-pale);color:var(--teal);border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;margin-bottom:12px;letter-spacing:.5px}

/* ── Seonggok table ── */
.sg-table{width:100%;border-collapse:collapse;font-size:12.5px}
.sg-table th{text-align:left;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-bottom:2px solid var(--border);font-weight:600}
.sg-table td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.sg-table tr:last-child td{border-bottom:none}
.sg-table tr.active-row td{background:var(--blue-pale)}
.sg-table tr.active-row td:first-child{border-left:3px solid var(--blue)}

/* ── Balance card ── */
.bal-card{border-radius:var(--r);padding:18px;border:1.5px solid;margin-bottom:14px}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-hdr{text-align:center;font-size:9.5px;font-weight:700;padding:6px 0;color:var(--light);letter-spacing:.5px}
.cal-cell{border-radius:6px;padding:4px 3px;min-height:54px;background:white;border:1px solid var(--border);transition:border-color .2s}
.cal-cell:hover{border-color:var(--blue)}
.day-n{font-size:10px;text-align:center;margin-bottom:2px;font-weight:600}
.e-dot{border-radius:4px;padding:1px 4px;color:white;font-size:7px;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.6}

/* ── Buttons ── */
.btn-primary{width:100%;padding:12px;background:var(--navy);color:white;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;transition:all .2s;letter-spacing:.3px}
.btn-primary:hover{background:var(--navy2)}
.btn-accent{background:var(--blue);color:white}
.btn-accent:hover{opacity:.9;background:var(--blue)}
.btn-amber{background:var(--amber);color:white}

.form-box{background:var(--card);border-radius:var(--r);padding:18px;margin:8px 0 14px;box-shadow:var(--shadow-md);border:1.5px solid var(--blue);display:flex;flex-direction:column;gap:10px}
.f-inp{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;width:100%;background:white;color:var(--text);transition:border-color .2s}
.f-inp:focus{border-color:var(--blue)}
.row2{display:flex;gap:8px}
.save-btn{flex:1;padding:11px;background:var(--navy);color:white;border:none;border-radius:var(--r-sm);cursor:pointer;font-weight:700;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;transition:all .2s}
.save-btn:hover{background:var(--blue)}
.cancel-btn{flex:1;padding:11px;background:var(--bg);color:var(--muted);border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:pointer;font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;transition:all .2s}
.cancel-btn:hover{border-color:var(--muted)}

/* ── Event list ── */
.ev-list{background:var(--card);border-radius:var(--r);padding:16px;margin-top:10px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.ev-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.ev-item:last-child{border:none}
.ev-bar{width:3px;border-radius:2px;min-height:32px;flex-shrink:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}

/* ── Travel ── */
.tr-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:10px;position:relative}
.map-btn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:5px 12px;background:var(--bg);color:var(--blue);border-radius:20px;font-size:10.5px;font-weight:700;text-decoration:none;border:1px solid var(--border);transition:all .2s}
.map-btn:hover{background:var(--blue-pale);border-color:var(--blue)}
.del-btn{position:absolute;top:12px;right:12px;background:none;border:1px solid var(--border);color:var(--light);font-size:14px;cursor:pointer;padding:3px 8px;border-radius:6px;line-height:1;transition:all .2s}
.del-btn:hover{color:var(--coral);background:var(--coral-pale);border-color:var(--coral)}

/* ── Map ── */
#travel-map{height:300px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.leaflet-popup-content b{font-family:'DM Sans',sans-serif;font-size:12px}
.leaflet-popup-content{font-family:'DM Sans','Apple SD Gothic Neo',sans-serif;font-size:11px;line-height:1.6}
.map-stat-row{display:flex;gap:14px;margin:8px 0 10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.map-stat-row span{display:flex;align-items:center;gap:5px}
.map-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ── Wish ── */
.wish-card{background:#FDFAF4;border:1.5px solid #EDE3C8;border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;position:relative}
.wish-card .del-btn{top:8px;right:8px}

/* ── Checklist ── */
.prog-bg{background:var(--border);border-radius:4px;height:5px;overflow:hidden;margin-top:10px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal) 0%,var(--blue) 100%);border-radius:4px;transition:width .4s ease}
.ch-cat{margin-bottom:18px}
.ch-cat-hdr{font-weight:700;font-size:11px;color:var(--text);padding:8px 12px;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:var(--r-sm) var(--r-sm) 0 0;border:1.5px solid var(--border);border-bottom:none}
.ch-body{border:1.5px solid var(--border);border-radius:0 0 var(--r-sm) var(--r-sm);overflow:hidden;background:var(--card)}
.ch-item{display:flex;align-items:center;border-bottom:1px solid var(--border)}
.ch-item:last-child{border:none}
.ch-check-area{display:flex;align-items:center;gap:10px;flex:1;padding:10px 14px;cursor:pointer;user-select:none;min-width:0}
.ch-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.empty{text-align:center;padding:36px 20px;color:var(--light);line-height:2;font-size:13px}

/* ── Change badge ── */
.badge-pos{display:inline-block;background:#DCF5E9;color:#059669;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700}
.badge-neg{display:inline-block;background:#FEE2E2;color:#DC2626;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#main-content>*{animation:fadeUp .25s ease both}
</style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo-area">
        <div class="logo-mark">M</div>
        <div class="logo-text">
          <div class="logo-title">Missouri Life Manager</div>
          <div class="logo-sub">2026.07 – 2027.08 &nbsp;·&nbsp; Seonggok Fellowship</div>
        </div>
      </div>
      <div class="dday-pill" id="d-day">⏳ 계산중…</div>
    </div>
    <div class="rate-strip">
      <div>
        <div class="rate-lbl">💱 USD → KRW &nbsp;<span id="rate-date" style="opacity:.6;font-size:9.5px"></span></div>
        <div style="margin-top:3px">
          <span id="rate-display" class="rate-val"></span>
        </div>
      </div>
      <button class="rate-edit-btn" onclick="toggleRateEdit()">✏️ 환율 수정</button>
    </div>
  </div>

  <!-- ── Tab bar ── -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab(0)">💰 재무관리</button>
    <button class="tab-btn" onclick="switchTab(1)">📅 스케줄</button>
    <button class="tab-btn" onclick="switchTab(2)">✈️ 여행관리</button>
    <button class="tab-btn" onclick="switchTab(3)">✅ 출국준비</button>
  </div>

  <div class="content" id="main-content"></div>
</div>

<script>
const DEPARTURE=new Date("2026-08-03");
const TYPE_COLORS={academic:"#1557B0",seminar:"#5B4FD4",holiday:"#00957A",personal:"#C05A2A"};
const TYPE_LABELS={academic:"학사",seminar:"세미나",holiday:"공휴일",personal:"개인"};

const MONTHS=[];
for(let y=2026;y<=2027;y++)
  for(let m=(y===2026?7:1);m<=(y===2027?8:12);m++)
    MONTHS.push(`${y}-${String(m).padStart(2,"0")}`);

const SEONGGOK={"2026-07":9250,"2026-10":9000,"2027-01":9000,"2027-04":9000};

function getThursdays(start,end){
  const dates=[];const d=new Date(start);
  while(d.getDay()!==4)d.setDate(d.getDate()+1);
  const e=new Date(end);
  while(d<=e){dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+7);}
  return dates;
}
const FALL_THU=getThursdays("2026-08-26","2026-12-17");
const SPRING_THU=getThursdays("2027-01-20","2027-05-13");

function buildPresetEvents(){
  const base=[
    {id:"e_dep",date:"2026-08-03",title:"✈️ 미국 출발",type:"personal"},
    {id:"e_f1",date:"2026-08-26",title:"🎓 가을학기 개강",type:"academic"},
    {id:"e_f2",date:"2026-09-07",title:"🇺🇸 Labor Day",type:"holiday"},
    {id:"e_f3",date:"2026-10-12",title:"🇺🇸 Columbus Day",type:"holiday"},
    {id:"e_f4",date:"2026-11-11",title:"🇺🇸 Veterans Day",type:"holiday"},
    {id:"e_f5",date:"2026-11-26",title:"🦃 Thanksgiving",type:"holiday"},
    {id:"e_f6",date:"2026-12-18",title:"🎓 가을학기 종강",type:"academic"},
    {id:"e_f7",date:"2026-12-19",title:"❄️ 겨울방학",type:"academic"},
    {id:"e_f8",date:"2026-12-25",title:"🎄 Christmas",type:"holiday"},
    {id:"e_f9",date:"2027-01-01",title:"🎆 New Year's Day",type:"holiday"},
    {id:"e_f10",date:"2027-01-18",title:"🇺🇸 MLK Day",type:"holiday"},
    {id:"e_f11",date:"2027-01-20",title:"🎓 봄학기 개강",type:"academic"},
    {id:"e_f12",date:"2027-02-15",title:"🇺🇸 Presidents' Day",type:"holiday"},
    {id:"e_f13",date:"2027-05-14",title:"🎓 봄학기 종강",type:"academic"},
    {id:"e_f14",date:"2027-05-31",title:"🇺🇸 Memorial Day",type:"holiday"},
    {id:"e_f15",date:"2027-07-04",title:"🎆 Independence Day",type:"holiday"},
    {id:"e_f16",date:"2027-08-01",title:"✈️ 귀국 예정",type:"personal"},
  ];
  Object.entries(SEONGGOK).forEach(([m,amt])=>{
    base.push({id:"sg_"+m,date:m+"-01",title:`💰 성곡재단 $${amt.toLocaleString()}`,type:"personal"});
  });
  FALL_THU.forEach((d,i)=>base.push({id:"sem_f"+i,date:d,title:"📚 목요 세미나",type:"seminar"}));
  SPRING_THU.forEach((d,i)=>base.push({id:"sem_s"+i,date:d,title:"📚 목요 세미나",type:"seminar"}));
  return base.map(e=>({...e,color:TYPE_COLORS[e.type]}));
}

function buildInitFinance(){
  const fin={};
  Object.entries(SEONGGOK).forEach(([m,amt])=>{fin[m]={seonggok:String(amt)};});
  return fin;
}

const INIT_CHECKS=[
  {id:1,cat:"📄 서류",text:"여권 유효기간 확인 (2년 이상 권장)",done:false},
  {id:2,cat:"📄 서류",text:"J-1 비자 취득",done:false},
  {id:3,cat:"📄 서류",text:"DS-2019 서류 수령",done:false},
  {id:4,cat:"📄 서류",text:"성곡재단 파견 확인서",done:false},
  {id:5,cat:"📄 서류",text:"국제운전면허증 발급",done:false},

  {id:7,cat:"💳 금융",text:"해외 결제 카드 준비 (트래블월렛/하나)",done:false},

/* ── LocalStorage ── */
function loadLocal(){
  try{
    const d=JSON.parse(localStorage.getItem("msl_data")||"{}");
    if(d.finance)state.finance={...buildInitFinance(),...d.finance};
    if(d.travels)state.travels=d.travels;
    if(d.checks)state.checks=d.checks;
    if(d.rate)state.rate=d.rate;
    if(d.wishlist)state.wishlist=d.wishlist;
    if(d.geoCache)state.geoCache=d.geoCache;
    if(d.catOrder)state.catOrder=d.catOrder;
    else if(d.checks)state.catOrder=[...new Set(d.checks.map(c=>c.cat))];
  }catch(e){}
}
function saveLocal(){
  try{
    localStorage.setItem("msl_data",JSON.stringify({
      finance:state.finance,travels:state.travels,
      checks:state.checks,rate:state.rate,
      wishlist:state.wishlist,geoCache:state.geoCache,
      catOrder:state.catOrder
    }));
  }catch(e){}
}

/* ── Helpers ── */
const fmt=(n,d=0)=>Number(n||0).toLocaleString("ko-KR",{maximumFractionDigits:d});
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const firstDay=(y,m)=>new Date(y,m-1,1).getDay();
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtMonth=m=>m.replace("-","년 ").replace(/(\d+)$/,n=>parseInt(n)+"월");

function getDday(){
  const diff=Math.ceil((DEPARTURE-new Date())/86400000);
  if(diff>0)return`✈️ 출발까지 D-${diff}`;
  if(diff===0)return"✈️ 오늘 출발!";
  return`🌍 미주리 생활 D+${-diff}`;
}

function getCarryover(targetM){
  const idx=MONTHS.indexOf(targetM);
  if(idx<=0)return 0;
  let carry=0;
  for(let i=0;i<idx;i++){
    const m=MONTHS[i];const d=state.finance[m]||{};const r=state.rate;
    const sg=(parseFloat(d.seonggok)||0)*r;const yn=parseFloat(d.yonhap)||0;
    const rent=(parseFloat(d.rent)||0)*r;const living=(parseFloat(d.living)||0)*r;
    const korF=parseFloat(d.korFixed)||0;const trE=(parseFloat(d.travelExp)||0)*r;
    const bal=(sg+yn+carry)-(rent+living+korF+trE);
    carry=bal>0?bal:0;
  }
  return carry;
}

function calcFin(m){
  const d=state.finance[m]||{};const r=state.rate;
  const sg=(parseFloat(d.seonggok)||0)*r;const yn=parseFloat(d.yonhap)||0;
  const carry=getCarryover(m);
  const rent=(parseFloat(d.rent)||0)*r;const living=(parseFloat(d.living)||0)*r;
  const korF=parseFloat(d.korFixed)||0;const trE=(parseFloat(d.travelExp)||0)*r;
  return{d,sg,yn,carry,rent,living,korF,trE,income:sg+yn+carry,expense:rent+living+korF+trE};
}

function travelAmtKRW(t){const amt=parseFloat(t.amount??t.usd)||0;const cur=t.currency||"USD";return cur==="KRW"?amt:amt*state.rate;}
function travelAmtUSD(t){const amt=parseFloat(t.amount??t.usd)||0;const cur=t.currency||"USD";return cur==="KRW"?amt/state.rate:amt;}
function travelMainDisplay(t){const amt=parseFloat(t.amount??t.usd)||0;const cur=t.currency||"USD";return cur==="KRW"?`₩${fmt(amt,0)}`:`$${fmt(amt,0)}`;}
function travelSubDisplay(t){const amt=parseFloat(t.amount??t.usd)||0;const cur=t.currency||"USD";return cur==="KRW"?`≈ $${fmt(amt/state.rate,0)}`:`≈ ${fmt(amt*state.rate)}원`;}

function updateRateDisplay(){
  const el=document.getElementById("rate-display");
  if(el)el.textContent=`1 USD = ${fmt(state.rate)} KRW`;
  const dt=document.getElementById("rate-date");
  if(dt)dt.textContent=state.rateDate;
}

function toggleRateEdit(){
  state.editingRate=!state.editingRate;
  const display=document.getElementById("rate-display");
  if(state.editingRate){
    display.outerHTML=`<input class="rate-input-inline" id="rate-inp" type="number" value="${state.rate}" onchange="applyRate(this.value)" onblur="state.editingRate=false;updateRateDisplay()"/>`;
    document.getElementById("rate-inp")?.focus();
  }else{updateRateDisplay();}
}

function applyRate(v){
  const n=parseInt(v);
  if(n>500&&n<5000){state.rate=n;state.rateDate="수동 입력";saveLocal();if(state.tab===0)renderContent();}
}

/* ── Map ── */
let mapInstance=null;

async function getCoords(name){
  if(state.geoCache[name])return state.geoCache[name];
  try{
    await new Promise(r=>setTimeout(r,350));
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name)}&limit=1`,{headers:{"Accept-Language":"en","User-Agent":"MissouriLifeManager/1.0"}});
    const data=await res.json();
    if(data.length>0){
      const coords={lat:parseFloat(data[0].lat),lng:parseFloat(data[0].lon)};
      state.geoCache[name]=coords;saveLocal();return coords;
    }
  }catch(e){}
  return null;
}

function makeIcon(color,emoji){
  return L.divIcon({
    className:"",
    html:`<div style="width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);font-size:13px;line-height:1">${emoji}</span></div>`,
    iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-34]
  });
}

async function initTravelMap(){
  if(mapInstance){mapInstance.remove();mapInstance=null;}
  const el=document.getElementById("travel-map");
  if(!el||typeof L==="undefined")return;
  mapInstance=L.map("travel-map",{zoomControl:true}).setView([39.5,-98.5],4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:18}).addTo(mapInstance);
  const visitedIcon=makeIcon("#00957A","✅");
  const wishIcon=makeIcon("#E8920A","⭐");
  const allCoords=[];
  for(const t of state.travels){
    const c=await getCoords(t.dest);
    if(c){
      allCoords.push([c.lat,c.lng]);
      L.marker([c.lat,c.lng],{icon:visitedIcon}).addTo(mapInstance)
        .bindPopup(`<b>✅ ${t.dest}</b><br>${t.start}${t.end&&t.end!==t.start?` ~ ${t.end}`:""}<br><span style="color:#00957A;font-weight:700">${travelMainDisplay(t)}</span>${t.note?`<br><span style="color:#666">${t.note}</span>`:""}`);
    }
  }
  for(const w of state.wishlist){
    const c=await getCoords(w.name);
    if(c){
      allCoords.push([c.lat,c.lng]);
      L.marker([c.lat,c.lng],{icon:wishIcon}).addTo(mapInstance)
        .bindPopup(`<b>⭐ ${w.name}</b>${w.note?`<br><span style="color:#666">${w.note}</span>`:""}`);
    }
  }
  if(allCoords.length>0)mapInstance.fitBounds(allCoords,{padding:[40,40],maxZoom:10});
}

}

function renderContent(){

}

function renderSchedule(){
  const ci=MONTHS.indexOf(state.calM);
  const [cy,cm]=state.calM.split("-").map(Number);
  const days=daysIn(cy,cm);const fd=firstDay(cy,cm);
  const todayStr=new Date().toISOString().slice(0,10);
  const DOW=["일","월","화","수","목","금","토"];
  const DOW_C=["#D94040","var(--muted)","var(--muted)","var(--muted)","var(--muted)","var(--muted)","#1557B0"];

  let cells="";
  for(let i=0;i<fd;i++)cells+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${cy}-${String(cm).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const devs=state.events.filter(e=>e.date===ds);
    const isToday=ds===todayStr;const dow=(fd+d-1)%7;
    cells+=`<div class="cal-cell" style="background:${isToday?"#EBF3FF":"white"};border-color:${isToday?"#1557B0":"var(--border)"}">
      <div class="day-n" style="color:${DOW_C[dow]};font-weight:${isToday?800:500}">${d}</div>
      ${devs.slice(0,2).map(ev=>`<div class="e-dot" style="background:${ev.color}">${ev.title}</div>`).join("")}
      ${devs.length>2?`<div style="font-size:7px;color:var(--light);padding:0 2px">+${devs.length-2}</div>`:""}
    </div>`;
  }

  const monthEvs=state.events.filter(e=>e.date.startsWith(state.calM)).sort((a,b)=>a.date.localeCompare(b.date));
  const nonSeminar=monthEvs.filter(e=>e.type!=="seminar");
  const seminarCount=monthEvs.filter(e=>e.type==="seminar").length;

  const evForm=state.showEv?`
    <div class="form-box">
      <input class="f-inp" type="date" id="ev-date" value="${state.newEv.date}"/>
      <input class="f-inp" id="ev-title" placeholder="일정 제목" value="${state.newEv.title}"/>
      <select class="f-inp" id="ev-type">
        <option value="academic" ${state.newEv.type==="academic"?"selected":""}>학사일정</option>
        <option value="seminar" ${state.newEv.type==="seminar"?"selected":""}>세미나</option>
        <option value="holiday" ${state.newEv.type==="holiday"?"selected":""}>공휴일</option>
        <option value="personal" ${state.newEv.type==="personal"?"selected":""}>개인</option>
      </select>
      <div class="row2">
        <button class="save-btn" onclick="addEvent()">저장</button>
        <button class="cancel-btn" onclick="state.showEv=false;renderContent()">취소</button>
      </div>
    </div>`:"";

  return`
  <div class="mnav">
    <button class="mn-btn" onclick="moveCal(-1)" ${ci===0?"disabled":""}>‹</button>
    <span class="mn-label">${cy}년 ${cm}월</span>
    <button class="mn-btn" onclick="moveCal(1)" ${ci===MONTHS.length-1?"disabled":""}>›</button>
  </div>

  <div class="card" style="padding:14px">
    <div class="cal-grid" style="margin-bottom:4px">
      ${DOW.map((d,i)=>`<div class="day-hdr" style="color:${DOW_C[i]}">${d}</div>`).join("")}
    </div>
    <div class="cal-grid">${cells}</div>
  </div>

  <button class="btn-primary" onclick="state.showEv=!state.showEv;renderContent()">+ 일정 추가</button>
  ${evForm}

  ${(nonSeminar.length>0||seminarCount>0)?`
  <div class="ev-list" style="margin-top:12px">
    <div style="font-weight:700;font-size:12.5px;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:6px">
      <span>이달의 일정</span>
      <span style="font-size:10px;color:var(--muted);font-weight:400">${monthEvs.length}건</span>
    </div>
    ${seminarCount>0?`<div class="ev-item">
      <div class="ev-bar" style="background:#5B4FD4"></div>
      <div><div style="font-size:12.5px;font-weight:700">📚 목요 세미나</div><div style="font-size:10.5px;color:var(--light)">이번 달 ${seminarCount}회</div></div>
    </div>`:""}
    ${nonSeminar.map(ev=>`<div class="ev-item">
      <div class="ev-bar" style="background:${ev.color}"></div>
      <div><div style="font-size:12.5px;font-weight:600">${ev.title}</div><div style="font-size:10.5px;color:var(--light)">${ev.date}</div></div>
    </div>`).join("")}
  </div>`:""}

  <div class="legend" style="margin-top:12px">
    ${Object.entries(TYPE_LABELS).map(([t,l])=>`<div class="leg-item"><div style="width:8px;height:8px;border-radius:2px;background:${TYPE_COLORS[t]}"></div><span>${l}</span></div>`).join("")}
  </div>`;
}

/* ════════════════════════════════════
   TRAVEL
════════════════════════════════════ */
function renderTravel(){
  const totalUSD=state.travels.reduce((s,t)=>s+travelAmtUSD(t),0);

  const trForm=state.showTr?`
    <div class="form-box">
      <input class="f-inp" id="tr-dest" placeholder="목적지 (예: Chicago, IL)" value="${state.newTr.dest}"/>
      <div class="row2">
        <input class="f-inp" type="date" id="tr-start" value="${state.newTr.start}" style="flex:1"/>
        <input class="f-inp" type="date" id="tr-end" value="${state.newTr.end}" style="flex:1"/>
      </div>
      <div class="i-wrap">
        <select id="tr-currency" style="padding:0 12px;background:#F5F7FA;color:var(--muted);border:none;border-right:1.5px solid var(--border);font-size:12px;font-weight:700;cursor:pointer" onchange="state.newTr.currency=this.value;renderContent()">
          <option value="USD" ${state.newTr.currency==="USD"?"selected":""}>$ USD</option>
          <option value="KRW" ${state.newTr.currency==="KRW"?"selected":""}>₩ KRW</option>
        </select>
        <input class="inp" type="number" id="tr-amount" placeholder="총 지출" value="${state.newTr.amount}"/>
      </div>
      <input class="f-inp" id="tr-note" placeholder="메모 (숙소·교통·입장료 등)" value="${state.newTr.note}"/>
      <div class="row2">
        <button class="save-btn" onclick="addTravel()">저장</button>
        <button class="cancel-btn" onclick="state.showTr=false;renderContent()">취소</button>
      </div>
    </div>`:"";

  const wishForm=state.showWish?`
    <div class="form-box" style="border-color:var(--amber)">
      <input class="f-inp" id="wish-name" placeholder="가고 싶은 곳 (예: Yellowstone NP)"/>
      <input class="f-inp" id="wish-note" placeholder="메모 (이유·예상 비용 등)"/>
      <div class="row2">
        <button class="save-btn" style="background:var(--amber)" onclick="addWish()">저장</button>
        <button class="cancel-btn" onclick="state.showWish=false;renderContent()">취소</button>
      </div>
    </div>`:"";

  return`
  <!-- 지도 -->
  <div class="card" style="padding:14px">
    <div class="card-title" style="margin-bottom:8px">🗺 내 여행 지도</div>
    <div class="map-stat-row">
      <span><span class="map-dot" style="background:#00957A"></span>여행한 곳 (${state.travels.length})</span>
      <span><span class="map-dot" style="background:#E8920A"></span>가고 싶은 곳 (${state.wishlist.length})</span>
      <span style="margin-left:auto;color:var(--light);font-size:10px">핀 클릭 → 상세정보</span>
    </div>
    <div id="travel-map"></div>
  </div>

  <!-- Banner -->
  <div class="banner">
    <div class="banner-lbl">누적 여행 지출 (USD 기준)</div>
    <div class="banner-val">$${fmt(totalUSD,0)}</div>
    <div class="banner-sub">≈ ${fmt(totalUSD*state.rate)}원 &nbsp;·&nbsp; 총 ${state.travels.length}번의 여행</div>
  </div>

  <button class="btn-primary btn-accent" style="margin-bottom:10px" onclick="state.showTr=!state.showTr;if(state.showTr)state.showWish=false;renderContent()">+ 여행 기록 추가</button>
  ${trForm}

  ${state.travels.length===0?`<div class="empty">아직 기록된 여행이 없어요 ✈️<br/>첫 미국 여행을 추가해보세요!</div>`:
    state.travels.map(t=>`
    <div class="tr-card">
      <button class="del-btn" onclick="removeTravel('${t.id}')">×</button>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-right:28px">
        <div>
          <div style="font-weight:700;font-size:15px">✅ ${t.dest}</div>
          <div style="font-size:11px;color:var(--light);margin-top:2px">${t.start}${t.end&&t.end!==t.start?` ~ ${t.end}`:""}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:800;color:#00957A;font-size:16px">${travelMainDisplay(t)}</div>
          <div style="font-size:10.5px;color:var(--light)">${travelSubDisplay(t)}</div>
        </div>
      </div>
      ${t.note?`<div style="font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${t.note}</div>`:""}
      <a href="https://www.google.com/maps/search/${encodeURIComponent(t.dest)}" target="_blank" class="map-btn">🗺 Google Maps에서 보기</a>
    </div>`).join("")}

  <!-- 버킷리스트 -->
  <div class="sec-hdr" style="margin-top:16px">
    <span class="sec-hdr-txt">⭐ 가고 싶은 곳</span>
    <div class="sec-hdr-line"></div>
  </div>
  <button class="btn-primary btn-amber" style="margin-bottom:10px" onclick="state.showWish=!state.showWish;if(state.showWish)state.showTr=false;renderContent()">+ 버킷리스트 추가</button>
  ${wishForm}
  ${state.wishlist.length===0?`<div class="empty" style="padding:20px">버킷리스트를 추가해보세요 ⭐<br/><span style="font-size:11px">지도에 노란 핀으로 표시돼요</span></div>`:
    state.wishlist.map(w=>`
    <div class="wish-card">
      <div style="font-size:22px;flex-shrink:0">⭐</div>
      <div style="flex:1;padding-right:22px">
        <div style="font-weight:700;font-size:13.5px;color:var(--text)">${w.name}</div>
        ${w.note?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${w.note}</div>`:""}
        <a href="https://www.google.com/maps/search/${encodeURIComponent(w.name)}" target="_blank" class="map-btn">🗺 Google Maps</a>
      </div>
      <button class="del-btn" onclick="removeWish('${w.id}')">×</button>
    </div>`).join("")}`;
}

/* ════════════════════════════════════
   CHECKLIST
════════════════════════════════════ */
function renderChecklist(){
  const done=state.checks.filter(c=>c.done).length;
  const total=state.checks.length;
  const pct=total>0?Math.round(done/total*100):0;
  const diff=Math.ceil((DEPARTURE-new Date())/86400000);

  const addCatForm=state.showAddCat?`
    <div class="form-box" style="margin-top:10px">
      <input class="f-inp" id="new-cat-name" placeholder="카테고리 이름 (예: 🎒 추가 짐)"/>
      <div class="row2">
        <button class="save-btn" onclick="addCat()">추가</button>
        <button class="cancel-btn" onclick="state.showAddCat=false;renderContent()">취소</button>
      </div>
    </div>`:"";

  const catsHtml=state.catOrder.map((cat,ci)=>{
    const items=state.checks.filter(c=>c.cat===cat);
    const catDone=items.filter(c=>c.done).length;
    const showAdd=state.addItemCatIdx===ci;
    const addItemForm=showAdd?`
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:#F8FAFE">
        <input class="f-inp" id="new-item-text" placeholder="항목 내용 입력" style="margin-bottom:6px"/>
        <div class="row2">
          <button class="save-btn" onclick="addCheckItem(${ci})">추가</button>
          <button class="cancel-btn" onclick="state.addItemCatIdx=null;renderContent()">취소</button>
        </div>
      </div>`:"";
    const itemsHtml=items.map(item=>{
      if(state.editCheckId===item.id){
        return`<div style="padding:10px 14px;border-bottom:1px solid var(--border);background:#F8FAFE">
          <input class="f-inp" id="edit-item-${item.id}" value="${esc(item.text)}" style="margin-bottom:6px"/>
          <div class="row2">
            <button class="save-btn" onclick="saveCheckItem(${item.id})">저장</button>
            <button class="cancel-btn" onclick="state.editCheckId=null;renderContent()">취소</button>
          </div>
        </div>`;
      }
      return`<div class="ch-item">
        <div class="ch-check-area" onclick="toggleCheck(${item.id})">
          <div class="ch-box" style="background:${item.done?"#1557B0":"white"};border-color:${item.done?"#1557B0":"var(--border)"}">
            ${item.done?`<span style="color:white;font-size:11px;font-weight:800">✓</span>`:""}
          </div>
          <span style="font-size:13px;text-decoration:${item.done?"line-through":"none"};color:${item.done?"var(--light)":"var(--text)"};word-break:break-all">${esc(item.text)}</span>
        </div>
        <div style="display:flex;gap:3px;padding:0 10px;flex-shrink:0">
          <button onclick="state.editCheckId=${item.id};state.addItemCatIdx=null;renderContent()"
            style="background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer;line-height:1">✏️</button>
          <button onclick="deleteCheckItem(${item.id})"
            style="background:var(--coral-pale);border:1px solid #FECACA;color:var(--coral);border-radius:5px;padding:4px 8px;font-size:13px;cursor:pointer;font-weight:700;line-height:1">×</button>
        </div>
      </div>`;
    }).join("");
    return`<div class="ch-cat">
      <div class="ch-cat-hdr">
        <span>${esc(cat)} <span style="font-weight:400;color:var(--muted);font-size:10px">${catDone}/${items.length}</span></span>
        <div style="display:flex;gap:5px">
          <button onclick="state.addItemCatIdx=state.addItemCatIdx===${ci}?null:${ci};state.editCheckId=null;renderContent()"
            style="background:var(--blue-pale);border:1px solid #BFD8F5;color:var(--blue);border-radius:5px;padding:3px 10px;font-size:10.5px;font-weight:700;cursor:pointer">+ 항목</button>
          <button onclick="deleteCat(${ci})"
            style="background:var(--coral-pale);border:1px solid #FECACA;color:var(--coral);border-radius:5px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer">×</button>
        </div>
      </div>
      <div class="ch-body">
        ${addItemForm}${itemsHtml}
        ${items.length===0&&!showAdd?`<div style="font-size:12px;color:var(--light);padding:14px;text-align:center">항목 없음 — + 항목 버튼으로 추가</div>`:""}
      </div>
    </div>`;
  }).join("");

  return`
  <div class="banner">
    <div class="banner-lbl">출국 준비 체크리스트</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:2px">
      <div class="banner-val" style="font-size:36px">${pct}<span style="font-size:18px;margin-left:2px">%</span></div>
      <div style="font-size:12px;color:rgba(255,255,255,.5)">${done} / ${total} 완료</div>
    </div>
    <div class="prog-bg" style="background:rgba(255,255,255,.12)"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="banner-sub">${diff>0?`출발까지 D-${diff}`:diff===0?"오늘 출발!":"출발 완료 🎉"}</div>
  </div>
  ${catsHtml}
  <button class="btn-primary btn-accent" onclick="state.showAddCat=!state.showAddCat;state.addItemCatIdx=null;renderContent()" style="margin-top:4px">+ 새 카테고리 추가</button>
  ${addCatForm}`;
}

/* ── Actions ── */
function moveFin(d){const i=MONTHS.indexOf(state.finM),n=i+d;if(n>=0&&n<MONTHS.length){state.finM=MONTHS[n];renderContent();}}
function moveCal(d){const i=MONTHS.indexOf(state.calM),n=i+d;if(n>=0&&n<MONTHS.length){state.calM=MONTHS[n];renderContent();}}

let _finTimer=null;
function fmtComma(v){const raw=String(v||"").replace(/[^0-9]/g,"");if(!raw)return"";return Number(raw).toLocaleString("ko-KR");}
function inputFin(el,field){
  const raw=el.value.replace(/[^0-9]/g,"");
  const cursor=el.selectionStart;const oldLen=el.value.length;
  el.value=raw?Number(raw).toLocaleString("ko-KR"):"";
  const newLen=el.value.length;
  el.selectionStart=el.selectionEnd=Math.max(0,cursor+(newLen-oldLen));
  if(!state.finance[state.finM])state.finance[state.finM]={};
  state.finance[state.finM][field]=raw;
  saveLocal();clearTimeout(_finTimer);_finTimer=setTimeout(()=>renderContent(),700);
}

function addEvent(){
  const date=document.getElementById("ev-date")?.value;
  const title=document.getElementById("ev-title")?.value;
  const type=document.getElementById("ev-type")?.value;
  if(!date||!title)return;
  state.events.push({id:"e"+Date.now(),date,title,type,color:TYPE_COLORS[type]||"#C05A2A"});
  state.showEv=false;state.newEv={date:"",title:"",type:"personal"};
  renderContent();
}

function addTravel(){
  const dest=document.getElementById("tr-dest")?.value?.trim();
  const start=document.getElementById("tr-start")?.value;
  if(!dest||!start)return;
  const currency=document.getElementById("tr-currency")?.value||"USD";
  const amount=document.getElementById("tr-amount")?.value||"0";
  const end=document.getElementById("tr-end")?.value||"";
  const note=document.getElementById("tr-note")?.value||"";
  const tId="t"+Date.now();
  state.travels.push({id:tId,dest,start,end,amount,currency,note});
  const evTitle=end&&end!==start?`✈️ ${dest} (~${end})`:`✈️ ${dest}`;
  state.events.push({id:"tr_ev_"+tId,date:start,title:evTitle,type:"personal",color:TYPE_COLORS["personal"]});
  state.showTr=false;state.newTr={dest:"",start:"",end:"",amount:"",currency:"USD",note:""};
  saveLocal();renderContent();
}

function removeTravel(id){
  state.travels=state.travels.filter(t=>t.id!==id);
  state.events=state.events.filter(e=>e.id!=="tr_ev_"+id);
  saveLocal();renderContent();
}

function addWish(){
  const name=document.getElementById("wish-name")?.value?.trim();
  if(!name)return;
  state.wishlist.push({id:"w"+Date.now(),name,note:document.getElementById("wish-note")?.value||""});
  state.showWish=false;saveLocal();renderContent();
}
function removeWish(id){state.wishlist=state.wishlist.filter(w=>w.id!==id);saveLocal();renderContent();}
function toggleCheck(id){state.checks=state.checks.map(c=>c.id===id?{...c,done:!c.done}:c);saveLocal();renderContent();}
function addCheckItem(catIdx){
  const cat=state.catOrder[catIdx];
  const text=document.getElementById("new-item-text")?.value?.trim();
  if(!text)return;
  state.checks.push({id:Date.now(),cat,text,done:false});
  state.addItemCatIdx=null;saveLocal();renderContent();
}
function saveCheckItem(id){
  const text=document.getElementById("edit-item-"+id)?.value?.trim();
  if(!text)return;
  state.checks=state.checks.map(c=>c.id===id?{...c,text}:c);
  state.editCheckId=null;saveLocal();renderContent();
}
function deleteCheckItem(id){
  if(!confirm("이 항목을 삭제할까요?"))return;
  state.checks=state.checks.filter(c=>c.id!==id);saveLocal();renderContent();
}
function addCat(){
  const name=document.getElementById("new-cat-name")?.value?.trim();
  if(!name||state.catOrder.includes(name))return;
  state.catOrder.push(name);state.showAddCat=false;saveLocal();renderContent();
}
function deleteCat(idx){
  const cat=state.catOrder[idx];
  const itemCount=state.checks.filter(c=>c.cat===cat).length;
  if(!confirm(itemCount>0?`"${cat}" 카테고리와 항목 ${itemCount}개를 삭제할까요?`:`"${cat}" 카테고리를 삭제할까요?`))return;
  state.checks=state.checks.filter(c=>c.cat!==cat);
  state.catOrder.splice(idx,1);saveLocal();renderContent();
}

/* ── Init ── */
loadLocal();
renderContent();

fetch("https://api.frankfurter.app/latest?from=USD&to=KRW")
  .then(r=>r.json())
  .then(d=>{state.rate=Math.round(d.rates.KRW);state.rateDate=d.date+" (ECB)";updateRateDisplay();if(state.tab===0)renderContent();})
  .catch(()=>{state.rateDate="수동 입력 가능";updateRateDisplay();});
</script>
</body>
</html>
